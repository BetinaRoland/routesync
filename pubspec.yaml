name: routesync
description: RouteSync college bus management, allocation and live tracking.
publish_to: none
version: 1.0.0+1
environment:
  sdk: ">=3.8.0 <5.0.0"
dependencies:
  flutter:
    sdk: flutter
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  firebase_database: ^11.1.4
  geolocator: ^13.0.1
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  file_picker: ^8.1.2
  csv: ^6.0.0
  qr_flutter: ^4.1.0
  url_launcher: ^6.3.0
  google_fonts: ^6.2.1
  http: ^1.2.2
  crypto: ^3.0.5
  pdf: ^3.11.1
  printing: ^5.13.2
  mobile_scanner: ^5.2.3
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.1
flutter:
  uses-material-design: true
  assets:
    - assets/logo.png
    - assets/logo_small.png
flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  web:
    generate: true
    image_path: assets/logo.png
  image_path: assets/logo.png
